<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>High Card Duel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600..900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" role="application" aria-label="High Card Duel game">
      <header class="header">
        <h1 class="title">High Card Duel</h1>
        <p class="subtitle">Flip a card. Highest rank wins.</p>
      </header>

      <section class="scoreboard" aria-label="Scoreboard">
        <div class="player-score" id="player1Score">
          <span class="name">Player 1</span>
          <span class="score" aria-live="polite">0</span>
        </div>
        <div class="vs">VS</div>
        <div class="player-score" id="player2Score">
          <span class="name">Player 2</span>
          <span class="score" aria-live="polite">0</span>
        </div>
      </section>

      <main class="table" aria-label="Card table">
        <div class="player" data-player="1">
          <div class="label">Player 1</div>
          <div class="card" id="cardP1" aria-label="Player 1 card" tabindex="0">
            <div class="card-inner">
              <div class="card-face card-front" aria-hidden="true">
                <div class="back-pattern"></div>
              </div>
              <div class="card-face card-back" aria-hidden="true">
                <div class="pips">
                  <div class="corner tl">
                    <span class="rank">A</span>
                    <span class="suit">♠</span>
                  </div>
                  <div class="center">
                    <span class="big-rank">A</span>
                    <span class="big-suit">♠</span>
                  </div>
                  <div class="corner br">
                    <span class="rank">A</span>
                    <span class="suit">♠</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="player" data-player="2">
          <div class="label">Player 2</div>
          <div class="card" id="cardP2" aria-label="Player 2 card" tabindex="0">
            <div class="card-inner">
              <div class="card-face card-front" aria-hidden="true">
                <div class="back-pattern"></div>
              </div>
              <div class="card-face card-back" aria-hidden="true">
                <div class="pips">
                  <div class="corner tl">
                    <span class="rank">A</span>
                    <span class="suit">♠</span>
                  </div>
                  <div class="center">
                    <span class="big-rank">A</span>
                    <span class="big-suit">♠</span>
                  </div>
                  <div class="corner br">
                    <span class="rank">A</span>
                    <span class="suit">♠</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <section class="controls" aria-label="Controls">
        <button id="drawBtn" class="btn primary" aria-label="Draw cards">Draw</button>
        <button id="resetBtn" class="btn" aria-label="Reset game">Reset</button>
      </section>

      <section class="result" aria-live="polite" id="resultText">Press Draw to begin</section>
    </div>

    <canvas id="confettiCanvas" class="confetti" aria-hidden="true"></canvas>

    <script src="./script.js"></script>
  </body>
</html>
